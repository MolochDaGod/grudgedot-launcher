name: CI/CD Pipeline

# Required: install on Node 22.
# Optional: Docker Hub + Kubernetes only when secrets exist — missing secrets skip, not fail.

on:
  push:
    branches: [main, production, develop]
  pull_request:
    branches: [main, production, develop]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          cp .env.example .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env

      - name: Verify critical exports
        run: node scripts/ci-verify.mjs

      - name: Lint code
        run: |
          echo "Linting would run here if configured"
          # npm run lint

      - name: Run tests
        run: |
          if npm run | grep -qE '^\s+test\b'; then
            npm test
          else
            echo "No test script configured — skipping"
          fi

  build-docker:
    name: build-docker
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only on main pushes, and only when Docker Hub credentials are present
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.DOCKER_USERNAME != '' &&
      secrets.DOCKER_PASSWORD != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/grudgedot:latest
            ${{ secrets.DOCKER_USERNAME }}/grudgedot:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/grudgedot:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/grudgedot:buildcache,mode=max

  deploy-kubernetes:
    name: deploy-kubernetes
    needs: build-docker
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.KUBE_CONFIG != ''
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create secrets
        run: |
          kubectl create secret generic grudgedot-secrets \
            --from-literal=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            --from-literal=PUTER_DB_USER=${{ secrets.PUTER_DB_USER }} \
            --from-literal=PUTER_DB_PASSWORD=${{ secrets.PUTER_DB_PASSWORD }} \
            --from-literal=AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --from-literal=AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --from-literal=AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }} \
            --namespace=grudgedot \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          for f in deploy/kubernetes/*.yaml; do
            if [ -f "$f" ]; then
              kubectl apply -f "$f" || echo "warn: apply failed for $f"
            fi
          done

      - name: Wait for deployment
        run: |
          kubectl wait --for=condition=available --timeout=300s \
            deployment/ai-agents \
            deployment/game-server \
            deployment/cloud-storage \
            -n grudgedot || echo "warn: some deployments not ready"

      - name: Get service URLs
        run: kubectl get services -n grudgedot || true
