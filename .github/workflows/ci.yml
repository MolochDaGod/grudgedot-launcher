name: CI

# Always verify the app can install + build on every update to main/production.
# Optional integrations (Drive sync, deploy) never fail the required gate.

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify critical exports
        run: node scripts/ci-verify.mjs

      - name: Google Drive sync (optional)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && [ -n "$DRIVE_FOLDER_ID" ]; then
            npm run asset:drive:sync
          else
            echo "Skipping Drive sync (secrets not configured)"
          fi

      - name: Build
        run: npm run build
        env:
          # Safe defaults so client bundles without local .env
          VITE_AUTH_GATEWAY_URL: https://id.grudge-studio.com
          VITE_GAME_DATA_URL: https://grudge-api-production-0d46.up.railway.app
          VITE_OBJECTSTORE_URL: https://objectstore.grudge-studio.com/api/v1
          VITE_ASSETS_URL: https://assets.grudge-studio.com
          VITE_AI_URL: https://ai.grudge-studio.com

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-public
          path: dist/public
          if-no-files-found: warn
          retention-days: 7
