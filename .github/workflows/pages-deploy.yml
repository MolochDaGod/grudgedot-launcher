name: Deploy to Cloudflare Pages

# Build always on main/production. Publish only when Cloudflare secrets exist.
# Missing secrets → skip publish (green), never fail the workflow.

on:
  push:
    branches: [main, production]
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify critical exports
        run: node scripts/ci-verify.mjs

      - name: Build
        run: npm run vercel-build
        env:
          VITE_AUTH_GATEWAY_URL: https://id.grudge-studio.com
          VITE_API_URL: ""
          VITE_GAME_DATA_URL: https://grudge-api-production-0d46.up.railway.app
          VITE_WS_URL: wss://grudge-api-production-0d46.up.railway.app
          VITE_ASSETS_URL: https://assets.grudge-studio.com
          VITE_OBJECTSTORE_URL: https://objectstore.grudge-studio.com/api/v1
          VITE_AI_URL: https://ai.grudge-studio.com
          VITE_BADGE_READER_URL: https://edge.grudge-studio.com

      - name: Detect Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials present — will publish"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not configured — build OK, publish skipped"
          fi

      - name: Publish to Cloudflare Pages
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: grudgedot
          directory: dist/public
          branch: ${{ github.ref_name }}
          wranglerVersion: "3"
