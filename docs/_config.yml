# grudgeDot docs — GitHub Pages (project site)
# Publishing: GitHub Actions custom workflow (.github/workflows/pages.yml)
# Docs: https://docs.github.com/en/pages
#       https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages

title: grudgeDot Docs
description: Official documentation for the grudgeDot launcher and Grudge Studio apps.
theme: just-the-docs

# Project site URL = https://<user>.github.io/<repo>
url: "https://molochdagod.github.io"
baseurl: "/grudgedot-launcher"

# Site identity (paths are relative to site root; baseurl applied by Jekyll)
logo: "/assets/images/logo.png"
favicon_ico: "/assets/images/logo.png"

# just-the-docs
color_scheme: dark
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
heading_anchors: true
nav_sort: case_insensitive
back_to_top: true
back_to_top_text: "Back to top"
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/MolochDaGod/grudgedot-launcher"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

aux_links:
  "Live app":
    - "https://grudge-studio.com"
  "GitHub":
    - "https://github.com/MolochDaGod/grudgedot-launcher"
  "Discord":
    - "https://discord.gg/FtGtmxmwkh"
aux_links_new_tab: true

# Markdown / build
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
permalink: pretty
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow
  warning:
    title: Warning
    color: red
  tip:
    title: Tip
    color: green

# Footer
footer_content: >-
  © Grudge Studio ·
  <a href="https://grudge-studio.com">grudge-studio.com</a> ·
  Docs published with
  <a href="https://docs.github.com/en/pages">GitHub Pages</a>
  + just-the-docs
